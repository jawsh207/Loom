# Installs the latest Folio release on an Android emulator, makes it the home app and tries
# to add a widget to the home screen. Screenshots, UI dumps and logs go to the ci-devtest branch.
name: Device test

on:
  workflow_run:
    workflows: ["Build Folio"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      api:
        description: "System image API level (blank: newest available)"
        default: ""

permissions:
  contents: write

env:
  ANDROID_AVD_HOME: /home/runner/avd

jobs:
  widget:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="build-${{ github.event.workflow_run.run_number }}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output folio.apk
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output folio.apk
          fi
          ls -l folio.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          AVDMANAGER=$(dirname "$SDKMANAGER")/avdmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -oE "system-images;android-[0-9.]+;[a-z_]+;x86_64" | sort -uV > images.txt
          tail -20 images.txt
          WANT="${{ github.event.inputs.api }}"
          IMG=""
          for flavor in default google_apis aosp_atd google_atd google_apis_playstore; do
            if [ -n "$WANT" ]; then
              c=$(grep -E "android-${WANT};${flavor};" images.txt | tail -1)
            else
              c=$(grep -E ";${flavor};" images.txt | sort -t- -k2 -V | tail -1)
            fi
            if [ -n "$c" ]; then
              api=$(echo "$c" | sed -E 's/.*android-([0-9]+).*/\1/')
              best=$(echo "$IMG" | sed -E 's/.*android-([0-9]+).*/\1/')
              if [ -z "$IMG" ] || [ "$api" -gt "${best:-0}" ]; then IMG="$c"; fi
            fi
          done
          echo "image: $IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          "$SDKMANAGER" emulator platform-tools "$IMG" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n test -k "$IMG" -d pixel_6 --force
          CFG="$ANDROID_AVD_HOME/test.avd/config.ini"
          sed -i '/^disk.dataPartition.size/d;/^hw.ramSize/d' "$CFG"
          printf 'disk.dataPartition.size=8G\nhw.ramSize=4096\n' >> "$CFG"
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Boot emulator
        timeout-minutes: 20
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim \
            -gpu guest -no-snapshot -wipe-data -memory 4096 -cores 4 > emulator.log 2>&1 &
          {
            timeout 900 adb wait-for-device; echo "wait-for-device: $?"
            for i in $(seq 1 120); do
              v=$(adb shell getprop sys.boot_completed 2>&1 | tr -d '\r')
              echo "boot_completed=$v"
              [ "$v" = "1" ] && break
              sleep 5
            done
            adb devices
            adb shell getprop ro.build.fingerprint
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            sleep 20
          } 2>&1 | tee boot.log
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]

      - name: Add a widget
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          python3 build-support/devtest.py out folio.apk 2>&1 | tee devtest.log

      - name: Publish results to ci-devtest branch
        if: always()
        run: |
          mkdir -p out && cp devtest.log emulator.log boot.log out/ 2>/dev/null || true
          echo "$IMG ${{ github.sha }} run ${{ github.run_id }}" > out/RUN
          cd out && git init -q -b ci-devtest && git add -A
          git -c user.name=folio-ci -c user.email=ci@users.noreply.github.com commit -qm "Device test ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-devtest

# Installs the latest Loom build of main on an Android emulator, makes it the home app and
# runs a scripted test: adding widgets, or the feed panel. Screenshots, UI dumps and logs go to
# the ci-devtest branch.
name: Device test

on:
  workflow_dispatch:
    inputs:
      api:
        description: "System image API level (blank: newest available)"
        default: ""
      gpu:
        description: "Emulator -gpu mode"
        default: "swangle_indirect"
      emu_args:
        description: "Extra emulator arguments"
        default: "-feature -ReadColorBufferDma"
      test:
        description: "What to test"
        type: choice
        options: [feed, widgets, grid, apps, icons]
        default: feed
      flavor:
        description: "System image type to prefer (default, google_apis, aosp_atd...); blank: default"
        default: ""
      release:
        description: "Test a published release (e.g. v0.3.3) instead of the latest build of main"
        default: ""

permissions:
  contents: write
  actions: read  # to download the APK from the latest build

env:
  ANDROID_AVD_HOME: /home/runner/avd

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then
            gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk
            cp apk/*.apk folio.apk
            ls -l folio.apk
            exit 0
          fi
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "APK from build run $RUN"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name Loom --dir apk
          cp apk/*.apk folio.apk
          ls -l folio.apk

      - name: Build the Test Bank app (two versions, launcher activity renamed in v2)
        if: inputs.test == 'apps'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          echo "build tools $BT, $JAR"
          keytool -genkeypair -keystore tb.jks -storepass android -keypass android -alias tb \
            -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Test Bank" > /dev/null
          for v in 1 2; do
            if [ $v = 1 ]; then ALIAS=MainOld; else ALIAS=MainNew; fi
            mkdir -p tb$v
            cat > tb$v/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.loom.testbank" android:versionCode="$v" android:versionName="$v">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
            <application android:label="Test Bank" android:hasCode="false">
              <activity android:name="android.app.Activity" android:exported="false" />
              <activity-alias android:name="com.loom.testbank.$ALIAS" android:exported="true"
                  android:targetActivity="android.app.Activity" android:label="Test Bank">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity-alias>
            </application>
          </manifest>
          EOF
            "$BT/aapt2" link -o tb$v/u.apk -I "$JAR" --manifest tb$v/AndroidManifest.xml
            "$BT/zipalign" -f 4 tb$v/u.apk tb$v/a.apk
            "$BT/apksigner" sign --ks tb.jks --ks-pass pass:android --out testbank$v.apk tb$v/a.apk
          done
          ls -l testbank*.apk

      - name: Download GrapheneOS apps and Brave (official releases)
        if: inputs.test == 'icons'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p extra-apks
          for repo in GrapheneOS/Camera GrapheneOS/PdfViewer GrapheneOS/Auditor GrapheneOS/AppStore GrapheneOS/Info; do
            d=$(mktemp -d)
            if gh release download --repo "$repo" --pattern '*.apk' --dir "$d"; then
              for f in "$d"/*.apk; do cp "$f" "extra-apks/$(basename "$repo")-$(basename "$f")"; done
            else
              echo "::warning::no APK from $repo"
            fi
          done
          gh release download --repo brave/brave-browser --pattern 'BraveMonox64.apk' --dir extra-apks \
            || echo "::warning::no Brave APK"
          # Open Camera (F-Droid), to compare its icon colour.
          curl -fsSL -o extra-apks/OpenCamera.apk https://f-droid.org/repo/net.sourceforge.opencamera_96.apk \
            || echo "::warning::no Open Camera APK"
          ls -l extra-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          AVDMANAGER=$(dirname "$SDKMANAGER")/avdmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list 2>/dev/null | grep -oE "system-images;android-[0-9.]+;[a-z_]+;x86_64" | sort -uV > images.txt
          tail -20 images.txt
          WANT="${{ github.event.inputs.api }}"
          IMG=""
          FLAVORS="default google_apis aosp_atd google_atd google_apis_playstore"
          [ -n "${{ inputs.flavor }}" ] && FLAVORS="${{ inputs.flavor }}"
          for flavor in $FLAVORS; do
            if [ -n "$WANT" ]; then
              c=$(grep -E "android-${WANT};${flavor};" images.txt | tail -1)
            else
              c=$(grep -E ";${flavor};" images.txt | sort -t- -k2 -V | tail -1)
            fi
            if [ -n "$c" ]; then
              api=$(echo "$c" | sed -E 's/.*android-([0-9]+).*/\1/')
              best=$(echo "$IMG" | sed -E 's/.*android-([0-9]+).*/\1/')
              if [ -z "$IMG" ] || [ "$api" -gt "${best:-0}" ]; then IMG="$c"; fi
            fi
          done
          echo "image: $IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          "$SDKMANAGER" emulator platform-tools "$IMG" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n test -k "$IMG" -d pixel_6 --force
          CFG="$ANDROID_AVD_HOME/test.avd/config.ini"
          sed -i '/^disk.dataPartition.size/d;/^hw.ramSize/d' "$CFG"
          printf 'disk.dataPartition.size=8G\nhw.ramSize=4096\n' >> "$CFG"
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Boot emulator
        timeout-minutes: 20
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim \
            -gpu ${{ github.event.inputs.gpu || 'swangle_indirect' }} -no-snapshot -wipe-data -memory 4096 -cores 4 ${{ inputs.emu_args }} > emulator.log 2>&1 &
          {
            timeout 900 adb wait-for-device; echo "wait-for-device: $?"
            for i in $(seq 1 120); do
              v=$(adb shell getprop sys.boot_completed 2>&1 | tr -d '\r')
              echo "boot_completed=$v"
              [ "$v" = "1" ] && break
              sleep 5
            done
            adb devices
            adb shell getprop ro.build.fingerprint
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            sleep 20
          } 2>&1 | tee boot.log
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]

      - name: Run the test
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          pip install --quiet pillow || true
          if [ "${{ inputs.test }}" = "widgets" ]; then
            python3 build-support/devtest.py out folio.apk 2>&1 | tee devtest.log
          elif [ "${{ inputs.test }}" = "icons" ]; then
            pip install --quiet pillow
            python3 build-support/devtest_icons.py out folio.apk extra-apks 2>&1 | tee devtest.log
          elif [ "${{ inputs.test }}" = "apps" ]; then
            python3 build-support/devtest_apps.py out folio.apk testbank1.apk testbank2.apk 2>&1 | tee devtest.log
          elif [ "${{ inputs.test }}" = "grid" ]; then
            python3 build-support/devtest_grid.py out folio.apk 2>&1 | tee devtest.log
          else
            # The local test site, reached from the emulator as 10.0.2.2:8000.
            python3 -m http.server 8000 --directory build-support/devtest-feed > http.log 2>&1 &
            python3 build-support/devtest_feed.py out folio.apk 2>&1 | tee devtest.log
            cp http.log out/ || true
          fi

      - name: Publish results to ci-devtest branch
        if: always()
        run: |
          mkdir -p out && cp devtest.log emulator.log boot.log images.txt out/ 2>/dev/null || true
          echo "$IMG ${{ github.sha }} run ${{ github.run_id }}" > out/RUN
          cd out && git init -q -b ci-devtest && git add -A
          git -c user.name=folio-ci -c user.email=ci@users.noreply.github.com commit -qm "Device test ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-devtest

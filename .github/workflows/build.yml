name: Build Loom

on:
  push:
    branches-ignore: [ci-logs, ci-logs-public, ci-devtest]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      latest:
        description: "Build with the newest build tools instead of gradle.properties"
        type: boolean
        default: false
      write_locks:
        description: "Update gradle.lockfiles for changed dependencies (written to ci-logs)"
        type: boolean
        default: false
  # Used by the "Build release" workflow (release.yml), the only way a release is published
  # apart from pushing a v* tag.
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}-${{ inputs.publish && 'release' || 'ci' }}
  cancel-in-progress: ${{ !inputs.publish }}

env:
  # Android 17 (API 37) framework classes including hidden and system APIs. Some vendored
  # GrapheneOS/AOSP libraries are built against these in Soong, so they are compiled the
  # same way here. Compile-time only; never packaged into the APK.
  # Source: github.com/Reginer/aosp-android-jar
  HIDDEN_API_JAR_URL: https://raw.githubusercontent.com/Reginer/aosp-android-jar/262f6ae931160011572a5adfe4ec6302585e8f60/android-37/android.jar
  HIDDEN_API_JAR_SHA256: 28226cd0fcf14b812275abb2e9b914f8501bff4847c80bf6ccc95bd49ae128dc
  COMPILE_SDK: "37.2"

permissions:
  contents: write  # to publish releases and the ci-logs branches

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Releases list the commits since the last one when the changelog has no recap.
          fetch-depth: ${{ inputs.publish && '0' || '1' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Pick build tool versions
        id: versions
        run: |
          if [ "${{ inputs.latest }}" = "true" ] || grep -q '^folio.useLatestTools=true' gradle.properties; then
            # Newest tools and libraries; the resulting lockfiles go to the ci-logs branch.
            echo "args=$(python3 build-support/latest_versions.py) --write-locks" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.write_locks }}" = "true" ] || ! ls gradle/modules/*/gradle.lockfile > /dev/null 2>&1; then
            echo "args=--write-locks" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
          grep '^folio\.' gradle.properties

      - name: Install Android SDK platform ${{ env.COMPILE_SDK }}
        run: |
          set -o pipefail
          {
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
            echo "sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            LIST=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "platforms;android-[0-9A-Za-z.\-]+" | sort -u)
            echo "$LIST" | grep -E "android-${COMPILE_SDK%%.*}"
            PKG="platforms;android-${COMPILE_SDK}"
            echo "installing: $PKG"
            "$SDKMANAGER" "$PKG"
            ls "$ANDROID_HOME/platforms"
            echo "PLATFORM_DIR=$ANDROID_HOME/platforms/android-${COMPILE_SDK}" >> "$GITHUB_ENV"
          } 2>&1 | tee sdk.log

      - name: Use the hidden-API android.jar for compiling
        run: |
          curl -fsSL -o /tmp/android.jar "$HIDDEN_API_JAR_URL"
          echo "$HIDDEN_API_JAR_SHA256  /tmp/android.jar" | sha256sum -c -
          cp "$PLATFORM_DIR/android.jar" "$PLATFORM_DIR/android-public.jar"
          cp /tmp/android.jar "$PLATFORM_DIR/android.jar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folio.jks"
            echo "FOLIO_KEYSTORE=$RUNNER_TEMP/folio.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "No FOLIO_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi

      # versionCode is the number of minutes since 2026-01-01, so every build is higher than
      # the one before and installs as an update (earlier CI builds used the run number).
      - name: Version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))
          # Releases without a typed version count up within this series: 0.3.0, 0.3.1, ...
          SERIES=0.3
          if [ "${{ inputs.publish }}" = "true" ]; then
            NAME="${VERSION_INPUT#v}"
            if [ -z "$NAME" ]; then
              LAST=$(git tag -l "v${SERIES}.*" | sed "s/^v${SERIES}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
              NAME="${SERIES}.$(( ${LAST:--1} + 1 ))"
            fi
            if ! [[ "$NAME" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Use only letters, digits, dots, dashes and underscores in the version."
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${SERIES}-dev.${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Loom $NAME (versionCode $CODE)"

      - name: Build
        env:
          FOLIO_VERSION_NAME: ${{ steps.version.outputs.name }}
          FOLIO_VERSION_CODE: ${{ steps.version.outputs.code }}
          FOLIO_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          echo "tool versions: ${{ steps.versions.outputs.args }}" | tee build.log
          gradle --version 2>&1 | tee -a build.log
          gradle ${{ steps.versions.outputs.args }} --continue --stacktrace :app:assembleRelease 2>&1 | tee -a build.log

      # References to non-public Android APIs crash a regular app at runtime (they work in
      # GrapheneOS's own launcher because it is part of the OS). The list goes to ci-logs.
      - name: Scan for hidden API use
        continue-on-error: true
        run: |
          python3 -I build-support/hidden_api_scan.py "$PLATFORM_DIR/android-public.jar" \
            "$PLATFORM_DIR/android.jar" gradle/modules/*/build > hidden-api.txt
          tail -1 hidden-api.txt; grep -c "used by" hidden-api.txt || true

      # Framework resources Folio uses that Android 16 doesn't have (they'd crash there).
      - name: Check Android 16 compatibility
        continue-on-error: true
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          "$SDKMANAGER" "platforms;android-36" > /dev/null
          python3 -I build-support/sdk_compat.py "$ANDROID_HOME/platforms/android-36/android.jar" \
            "$PLATFORM_DIR/android-public.jar" launcher3 systemui frameworks gradle/modules \
            > sdk-compat.txt
          cat sdk-compat.txt

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs gradle/modules/app/build/outputs/apk/release/*.apk \
            | grep -E "SHA-256|DN" | tee -a build.log
          # The release key: SHA-256 5acbbd65b56a3da013474344a728f1a6cdcfeefce22f45ca916f5f8141124018

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Loom
          path: gradle/modules/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Only "Build release" (release.yml) or a pushed v* tag publishes a GitHub release.
      - name: Publish release
        if: >-
          success() &&
          (inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release named $TAG already exists; pick another version."
            exit 1
          fi
          APK="Loom-${VERSION}.apk"
          cp gradle/modules/app/build/outputs/apk/release/*.apk "$APK"
          # The recap: CHANGELOG.md's "Unreleased" section (or the commits since the last
          # release if it's empty), then build details.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            python3 build-support/release_notes.py notes CHANGELOG.md "$PREV"
            echo
            echo "---"
            echo
            echo "Built from ${GITHUB_SHA::7}${PREV:+ (changes since $PREV)}."
            echo
            echo "Signing certificate SHA-256: \`$(grep -oE 'SHA-256 digest: [0-9a-f]+' build.log | head -1 | cut -d' ' -f3)\`"
          } > notes.md
          cat notes.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Loom ${VERSION}" \
            --notes-file notes.md --latest

          # File the recap under this version in CHANGELOG.md on main, leaving "Unreleased"
          # empty for the next release.
          git fetch -q origin main && git checkout -q -B changelog origin/main
          python3 build-support/release_notes.py file CHANGELOG.md "$VERSION" "$(date -u +%Y-%m-%d)"
          if ! git diff --quiet CHANGELOG.md; then
            git -c user.name=folio-ci -c user.email=ci@users.noreply.github.com \
              commit -qm "CHANGELOG: Loom ${VERSION}" CHANGELOG.md
            git push -q origin changelog:main || echo "::warning::Couldn't update CHANGELOG.md on main"
          fi

      # GitHub's log storage isn't reachable from every environment, so the logs are also
      # pushed to the ci-logs branch (one commit, overwritten each run).
      - name: Publish logs to ci-logs branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/ci-logs
          cp sdk.log build.log hidden-api.txt sdk-compat.txt /tmp/ci-logs/ 2>/dev/null || true
          for f in gradle/modules/*/gradle.lockfile; do
            [ -f "$f" ] && mkdir -p "/tmp/ci-logs/$(dirname "$f")" && cp "$f" "/tmp/ci-logs/$f"
          done
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not|BUILD" build.log > /tmp/ci-logs/errors.log 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }} ${{ job.status }}" > /tmp/ci-logs/RUN
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git add -A
          git -c user.name=folio-ci -c user.email=ci@users.noreply.github.com commit -qm "Logs for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  # Compiles Folio against the *public* Android 17 API only. Anything it reports is code that
  # uses Android internals: fine for the system launcher, but blocked for a regular app like
  # Folio. Informational; it doesn't fail the build. Logs go to the ci-logs-public branch.
  public-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request' && !inputs.publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK platform ${{ env.COMPILE_SDK }}
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-${COMPILE_SDK}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compile against the public API
        continue-on-error: true
        run: |
          gradle --continue :app:compileReleaseJavaWithJavac 2>&1 | tee public-api.log
      - name: Publish logs to ci-logs-public branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp public-api.log /tmp/out/ 2>/dev/null || true
          grep -nE "^e: |error:|cannot find symbol|symbol:|location:|What went wrong" public-api.log > /tmp/out/errors.log || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > /tmp/out/RUN
          cd /tmp/out && git init -q -b ci-logs-public && git add -A
          git -c user.name=folio-ci -c user.email=ci@users.noreply.github.com commit -qm "Public API check for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-public

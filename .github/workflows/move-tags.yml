name: Move release tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point each release tag at its rewritten commit, and fix the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          move() {  # tag old-short new-short
            git tag -f "$1" "$(git rev-parse "$3")"
            body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$1" -q .body 2>/dev/null || true)
            if [ -n "$body" ] && printf '%s' "$body" | grep -q "$2"; then
              id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$1" -q .id)
              printf '%s' "$body" | sed "s/$2/$3/g" > body.md
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -F body=@body.md > /dev/null
              echo "$1: notes now say $3"
            fi
          }
          move build-17 d88c839 ca7bc82
          move build-19 41aa4e8 240954e

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx4g

android.useAndroidX=true
# Launcher code uses R fields of its dependencies through its own R class, as Soong allows.
android.nonTransitiveRClass=false

# Tool versions. With folio.useLatestTools=true, CI ignores these and uses the newest releases.
folio.useLatestTools=false
folio.agp=9.4.1
folio.kotlin=2.4.20
folio.ksp=2.3.12
folio.protobuf=4.36.2
# Newest AndroidX releases need the API 37.2 SDK (Android 17 QPR2) to compile against.
folio.compileSdk=37.2
